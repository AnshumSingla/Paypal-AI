name: CI

on:
  push:
    branches: [main, collective]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests use an in-memory Postgres and the PayPal stand-in: no keys or services needed.
      - run: npm test
      - run: npm run build
