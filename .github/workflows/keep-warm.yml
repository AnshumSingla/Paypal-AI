name: Keep warm

# Render's free plan puts the service to sleep after 15 minutes without visitors, and the next
# visit waits for it to wake. Ping it every 10 minutes so the hosted demo stays awake.
# Pings the static icon, not /api/health, so the Neon database can still sleep between real visits.
# GitHub runs schedules only from the default branch (main) and may start them a few minutes late.
on:
  schedule:
    - cron: "5-55/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://collective-mxtv.onrender.com/icon.svg
