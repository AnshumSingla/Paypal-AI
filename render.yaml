# Render Blueprint for Collective: web service + managed Postgres. Deploy with New > Blueprint on render.com.
# Paid plans (starter web, basic Postgres) so the demo stays awake and its data persists through judging.
# Secrets (PayPal, Anthropic, Channel3, AG Studio) are prompted for at deploy time (sync: false).
services:
  - type: web
    name: collective
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collective-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_PERSONAL_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: AI_CALLS_PER_HOUR
        value: "200"
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE
        sync: false

databases:
  - name: collective-db
    plan: basic-256mb
    databaseName: collective
