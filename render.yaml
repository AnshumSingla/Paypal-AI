# Render Blueprint for Collective: one free web service. Deploy with New > Blueprint on render.com.
# Free plan: the service sleeps after 15 minutes without visitors and takes about a minute to wake.
# No managed Postgres (Render deletes free databases after 30 days): the app uses its embedded PGlite,
# created and seeded during the build (creating it at boot needs more than the free 512 MB). Each wake
# starts again from that copy, re-seeded for today if it's stale. Set DATABASE_URL to use Postgres instead.
# Secrets (PayPal, Gemini, Groq, Channel3, AG Studio) are prompted for at deploy time (sync: false).
services:
  - type: web
    name: collective
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run db:prepare
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_PERSONAL_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_CALLS_PER_HOUR
        value: "200"
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE
        sync: false
