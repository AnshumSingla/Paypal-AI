# Render Blueprint for Collective: one free web service. Deploy with New > Blueprint on render.com.
# Free plan: the service sleeps after 15 minutes without visitors and takes about a minute to wake.
# Database: a free Postgres from Neon (neon.com), pasted as DATABASE_URL. Render deletes its own free
# databases after 30 days, and the embedded PGlite used locally needs more than the free 512 MB on Linux.
# The build migrates and seeds the database (db:prepare); a stale, unstarted week is re-seeded on boot.
# Secrets (database, PayPal, Gemini, Groq, Channel3, AG Studio) are prompted for at deploy time (sync: false).
services:
  - type: web
    name: collective
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run db:prepare
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_PERSONAL_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_CALLS_PER_HOUR
        value: "200"
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE
        sync: false
